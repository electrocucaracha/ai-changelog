name: Continuous Integration
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
permissions: read-all
jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Run unit tests
        run: uvx tox -e py312
  # jscpd:ignore-start
  mutation-tests:
    name: Run mutation tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Run mutation tests (Makefile target)
        run: make mutation
      - name: Enforce no surviving mutations
        env:
          PYTHONPATH: src
        run: |
          uv run mutmut export-cicd-stats

          python - <<'PY'
          import json
          from pathlib import Path

          stats_file = Path("mutants/mutmut-cicd-stats.json")

          if not stats_file.exists():
              print(f"mutmut CI stats file not found: {stats_file}")
              raise SystemExit(1)

          stats = json.loads(stats_file.read_text())
          survived = int(stats.get("survived", 0))
          suspicious = int(stats.get("suspicious", 0))

          if survived or suspicious:
              print(
                  f"Mutation test gate failed: survived={survived}, "
                  f"suspicious={suspicious}"
              )
              raise SystemExit(1)

          print("Mutation test gate passed")
          PY
        # jscpd:ignore-end
