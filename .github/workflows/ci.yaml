name: Continuous Integration
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
permissions: read-all
jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Run unit tests
        run: uvx tox -e py312
  # jscpd:ignore-start
  mutation-tests:
    name: Run mutation tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [ai_provider, changelog, config, git_helper, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Install test dependencies
        run: uv sync --extra test
      - name: Restrict mutations to ${{ matrix.module }}
        run: |
          sed -i 's|source_paths = \["src/ai_changelog_msg/"\]|source_paths = ["src/ai_changelog_msg/${{ matrix.module }}.py"]|' pyproject.toml
      - name: Run mutation tests
        env:
          PYTHONPATH: src
        run: uv run mutmut run --no-progress
      - name: Export mutation stats
        env:
          PYTHONPATH: src
        run: uv run mutmut export-cicd-stats
      - name: Upload mutation stats
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutmut-stats-${{ matrix.module }}
          path: mutants/mutmut-cicd-stats.json
  mutation-gate:
    name: Enforce no surviving mutations
    runs-on: ubuntu-latest
    needs: mutation-tests
    permissions:
      contents: read
    steps:
      - name: Download all mutation stats
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutmut-stats-*
          path: mutmut-stats
      - name: Check no surviving mutations
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          total_survived = 0
          total_suspicious = 0

          for stats_file in Path("mutmut-stats").rglob("mutmut-cicd-stats.json"):
              stats = json.loads(stats_file.read_text())
              total_survived += int(stats.get("survived", 0))
              total_suspicious += int(stats.get("suspicious", 0))

          if total_survived or total_suspicious:
              print(
                  f"Mutation test gate failed: survived={total_survived}, "
                  f"suspicious={total_suspicious}"
              )
              sys.exit(1)

          print("Mutation test gate passed")
          PY
        # jscpd:ignore-end
