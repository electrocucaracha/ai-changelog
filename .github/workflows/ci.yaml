name: Continuous Integration
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
permissions: read-all
jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: "95"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Run unit tests
        run: uvx tox -e py312 -- --cov=ai_changelog_msg --cov-report=term-missing --cov-report=json
      - name: Enforce minimum coverage
        run: python3 ci/enforce_coverage.py
      - name: Publish coverage summary
        if: always()
        run: python3 ci/publish_coverage_summary.py
  functional-tests:
    name: Run functional tests (LLMock)
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Start LLMock server
        run: |
          python tests/mock_llm_server.py --host 127.0.0.1 --port 8001 \
            > llmock.log 2>&1 &
          echo "$!" > llmock.pid
      - name: Wait for LLMock readiness
        run: |
          for _ in $(seq 1 60); do
            if curl --noproxy '*' -fsS http://127.0.0.1:8001/ping >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat llmock.pid)" >/dev/null 2>&1; then
              echo "LLMock process exited before readiness"
              cat llmock.log || true
              exit 1
            fi
            sleep 1
          done
          echo "LLMock did not become ready within 60 seconds"
          cat llmock.log || true
          exit 1
      - name: Run functional tests against LLMock
        id: run-functional-tests
        continue-on-error: true
        env:
          CHANGELOG_FUNCTIONAL_LLM_MOCK: "1"
          LLM_MOCK_BASE_URL: "http://127.0.0.1:8001/chatgpt"
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: |
          # Propagate uppercase proxy env vars to lowercase for tools that only
          # read lowercase keys, while keeping YAML keys unique.
          export http_proxy="$HTTP_PROXY"
          export https_proxy="$HTTPS_PROXY"
          export all_proxy="$ALL_PROXY"
          export no_proxy="$NO_PROXY"
          set -o pipefail
          uvx tox -e py312 -- tests/test_functional_llm_mock.py -m integration --junitxml=functional-junit.xml 2>&1 | tee functional-tests.log
      - name: Collect LLMock logs
        if: always()
        run: cat llmock.log || true
      - name: Collect functional diagnostics
        if: always()
        run: |
          {
            echo "### Functional diagnostics"
            if [ -f llmock.pid ]; then
              pid="$(cat llmock.pid)"
              if kill -0 "$pid" >/dev/null 2>&1; then
                echo "- LLMock process status: running (pid=$pid)"
              else
                echo "- LLMock process status: not running (pid=$pid)"
              fi
            else
              echo "- LLMock pid file missing"
            fi
            echo "- LLMock /ping probe:"
            curl --noproxy '*' -iS http://127.0.0.1:8001/ping || true
          } | tee functional-diagnostics.log
      - name: Publish functional test summary
        if: always()
        env:
          TEST_EXIT_CODE: ${{ steps.run-functional-tests.outcome == 'success' && '0' || '1' }}
        run: python3 ci/publish_functional_summary.py
      - name: Show functional test logs on failure
        if: ${{ steps.run-functional-tests.outcome != 'success' }}
        run: |
          echo "--- functional-tests.log (tail) ---"
          tail -n 200 functional-tests.log || true
          echo "--- functional-diagnostics.log ---"
          cat functional-diagnostics.log || true
      - name: Show LLMock logs on failure
        if: ${{ steps.run-functional-tests.outcome != 'success' }}
        run: cat llmock.log || true
      - name: Stop LLMock server
        if: always()
        run: |
          if [ -f llmock.pid ]; then
            kill "$(cat llmock.pid)" || true
          fi
      - name: Fail job when functional tests fail
        if: always()
        run: |
          if [ "${{ steps.run-functional-tests.outcome }}" != "success" ]; then
            echo "Functional tests failed (outcome=${{ steps.run-functional-tests.outcome }})"
            exit 1
          fi
  # jscpd:ignore-start
  mutation-tests:
    name: Run mutation tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [ai_provider, changelog, config, git_helper, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Install test dependencies
        run: uv sync --extra test
      - name: Restrict mutations to ${{ matrix.module }}
        run: python ci/restrict_mutations.py --module "${{ matrix.module }}"
      - name: Run mutation tests
        env:
          PYTHONPATH: src
        run: uv run mutmut run
      - name: Export mutation stats
        if: always()
        env:
          PYTHONPATH: src
        run: uv run mutmut export-cicd-stats
      - name: Publish mutation summary
        if: always()
        run: python3 ci/publish_mutation_summary.py --module "${{ matrix.module }}"
      - name: Upload mutation stats
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-stats-${{ matrix.module }}
          path: mutants/mutmut-cicd-stats.json
  mutation-gate:
    name: Enforce mutation score threshold
    runs-on: ubuntu-latest
    needs: mutation-tests
    env:
      MUTATION_THRESHOLD: "95"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all mutation stats
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutmut-stats-*
          path: mutmut-stats
      - name: Enforce minimum mutation score
        run: python3 ci/enforce_mutation_score.py --stats-dir mutmut-stats
      - name: Publish aggregate mutation summary
        if: always()
        run: python3 ci/publish_mutation_aggregate.py --stats-dir mutmut-stats
        # jscpd:ignore-end
