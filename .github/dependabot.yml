version: 2
updates:
  # Keeps the Dockerfile's base image current. Dependabot only rewrites the
  # FROM tag/digest, so it never affects Hadolint's linting of the file.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
