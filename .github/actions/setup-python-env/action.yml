name: Setup Python Environment
description: Configures uv with Python. Requires actions/checkout to have been run first.
inputs:
  python-version:
    description: Python version to install. When omitted, reads from pyproject.toml.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false
    - name: Set up Python (from file)
      if: ${{ inputs.python-version == '' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: "pyproject.toml"
    - name: Set up Python (explicit version)
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
