[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-changelog"
version = "0.1.0"
description = "Generate AI-powered summaries of git commit diffs and store them in git notes"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
keywords = ["git", "ai", "summary", "changelog", "notes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "litellm>=1.84.0",
    "headroom-ai",
    "gitpython",
    "python-dotenv>=1.2.2",
    "click",
    "pydantic",
    "toon-format>=0.9.0b1",
]

[project.optional-dependencies]

test = [
    "pytest>=9.0.3",
    "pytest-mock",
    "pytest-cov",
    "mutmut",
]
eval = [
    "deepeval",
    "ollama",
]

[tool.uv]
# Keep transitive packages at versions with known CVE fixes.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "filelock>=3.20.3",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "setuptools>=83.0.0",
]

[project.scripts]
ai-changelog = "ai_changelog_msg.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_changelog_msg"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py312
skip_missing_interpreters = true
isolated_build = true

[testenv]
description = Run unit tests with pytest
extras = test
setenv =
    PYTHONPATH = {toxinidir}/src
commands =
    pytest {posargs}

[testenv:coverage]
description = Run tests with coverage reporting
extras = test
commands =
    pytest --cov=ai_changelog_msg --cov-report=html --cov-report=term-missing tests/

[testenv:lint]
description = Fix code style
deps =
    ruff
    black
    isort
skip_install = true
commands =
    ruff check --fix src/ tests/
    black src/ tests/
    isort src/ tests/

[testenv:lint-check]
description = Check code style
deps =
    ruff
    black
    isort
skip_install = true
commands =
    ruff check src/ tests/
    black --check src/ tests/
    isort --check src/ tests/
"""

[tool.mutmut]
source_paths = ["src/ai_changelog_msg/"]
do_not_mutate = ["src/ai_changelog_msg/__init__.py"]
do_not_mutate_patterns = [
    "raise [A-Za-z]",
]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src"]
known_first_party = ["ai_changelog_msg"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["click", "click.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "headroom.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "litellm"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["git", "git.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short --cov=ai_changelog_msg --cov-report=html --cov-report=term-missing --doctest-modules"
testpaths = ["tests", "src/ai_changelog_msg"]
markers = [
    "unit: Unit tests for individual modules",
    "integration: Integration tests",
    "slow: Tests that take a long time to run",
]
