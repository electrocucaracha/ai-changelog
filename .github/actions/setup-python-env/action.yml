name: Setup Python Environment
description: Configures uv with Python. Requires actions/checkout to have been run first.
inputs:
  python-version:
    description: Python version to install. When omitted, reads from pyproject.toml.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - name: Set up Python (from file)
      if: ${{ inputs.python-version == '' }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: "pyproject.toml"
    - name: Set up Python (explicit version)
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
