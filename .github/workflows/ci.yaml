name: Continuous Integration
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
permissions: read-all
jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: "95"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Run unit tests
        run: uvx tox -e py312 -- --cov=ai_changelog_msg --cov-report=term-missing --cov-report=json
      - name: Enforce minimum coverage
        run: python3 ci/enforce_coverage.py
      - name: Publish coverage summary
        if: always()
        run: python3 ci/publish_coverage_summary.py
  functional-tests:
    name: Run functional tests (LLMock)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Start LLMock server
        run: |
          docker run -d --rm --name llmock -p 8001:8001 node:20-alpine \
            sh -lc "npm install -g llmock@3.3.4 && llmock start --foreground --model=chatgpt --port=8001"
      - name: Wait for LLMock readiness
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ping >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "LLMock did not become ready within 60 seconds"
          docker logs llmock || true
          exit 1
      - name: Run functional tests against LLMock
        env:
          CHANGELOG_FUNCTIONAL_LLM_MOCK: "1"
          LLM_MOCK_BASE_URL: "http://127.0.0.1:8001/chatgpt"
        run: uvx tox -e py312 -- tests/test_functional_llm_mock.py -m integration
      - name: Show LLMock logs on failure
        if: failure()
        run: docker logs llmock
      - name: Stop LLMock server
        if: always()
        run: docker rm -f llmock || true
  # jscpd:ignore-start
  mutation-tests:
    name: Run mutation tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [ai_provider, changelog, config, git_helper, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
      - name: Install test dependencies
        run: uv sync --extra test
      - name: Restrict mutations to ${{ matrix.module }}
        run: python ci/restrict_mutations.py --module "${{ matrix.module }}"
      - name: Run mutation tests
        env:
          PYTHONPATH: src
        run: uv run mutmut run
      - name: Export mutation stats
        if: always()
        env:
          PYTHONPATH: src
        run: uv run mutmut export-cicd-stats
      - name: Publish mutation summary
        if: always()
        run: python3 ci/publish_mutation_summary.py --module "${{ matrix.module }}"
      - name: Upload mutation stats
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutmut-stats-${{ matrix.module }}
          path: mutants/mutmut-cicd-stats.json
  mutation-gate:
    name: Enforce mutation score threshold
    runs-on: ubuntu-latest
    needs: mutation-tests
    env:
      MUTATION_THRESHOLD: "95"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all mutation stats
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutmut-stats-*
          path: mutmut-stats
      - name: Enforce minimum mutation score
        run: python3 ci/enforce_mutation_score.py --stats-dir mutmut-stats
      - name: Publish aggregate mutation summary
        if: always()
        run: python3 ci/publish_mutation_aggregate.py --stats-dir mutmut-stats
        # jscpd:ignore-end
