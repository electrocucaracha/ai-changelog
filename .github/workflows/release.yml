name: Release with AI Changelog
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git fetch origin refs/notes/ai-changelog:refs/notes/ai-changelog || true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: ai-action/ollama-action@0b0ba51b122d9259d4f0a0118932f6bb719c1006 # v2.0.1
        with:
          model: llama3.1:8b
          prompt: Hi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama
      - name: Generate CHANGELOG.md
        run: |
          uvx --from git+https://github.com/electrocucaracha/ai-changelog.git ai-changelog --create-semver-tags --model ollama/llama3.1:8b --workers 2 .
          make fmt
      - name: Commit and push changelog
        uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc # v1.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}
          message: "docs(changelog): update release notes"
          tags: true
      - name: Push notes and tags
        run: git push origin refs/notes/ai-changelog || true
      - name: Resolve latest semantic tag
        id: release_tag
        run: |
          TAG="$(git tag --sort=-v:refname | head -n 1)"
          if [ -z "$TAG" ]; then
              echo "No semantic version tag found after changelog generation"
              exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          awk '/^## / { count++ } count == 3 { exit } { print }' CHANGELOG.md > tmp && mv tmp CHANGELOG.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          body_path: CHANGELOG.md
